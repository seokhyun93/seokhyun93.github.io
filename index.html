<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root {
    --accent: #c9705a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #ffffff;
    color: #141414;
  }
  .disclaimer {
    padding: 14px 24px;
    font-size: 11px;
    line-height: 1.6;
    color: #a3a3a3;
    letter-spacing: 0.01em;
    text-align: center;
    border-bottom: 1px solid #f2f2f2;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 0 60px;
  }
  .profile {
    text-align: center;
    padding: 40px 24px 28px;
  }
  .profile img {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    background: #f3f3f3;
    border: 1px solid #eaeaea;
  }
  .profile .username {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .profile .bio {
    margin-top: 5px;
    font-size: 12.5px;
    color: #8a8a8a;
  }
  .search-box {
    position: relative;
    margin: 0 24px 40px;
  }
  .search-box input {
    width: 100%;
    padding: 9px 26px 9px 2px;
    font-size: 13.5px;
    border: none;
    border-bottom: 1.5px solid var(--accent);
    outline: none;
    background: transparent;
    font-family: inherit;
    color: #141414;
  }
  .search-box input::placeholder {
    color: #bbb;
  }
  .search-box .icon {
    position: absolute;
    right: 2px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    pointer-events: none;
  }
  .category {
    padding: 0 24px 36px;
  }
  .category-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }
  .category-header .title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .category-header .toggle {
    font-size: 11px;
    color: #9a9a9a;
    letter-spacing: 0.01em;
    white-space: nowrap;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    flex-shrink: 0;
    font-family: inherit;
  }
  .category-header .toggle:hover {
    color: #141414;
  }
  .row {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .row::-webkit-scrollbar { display: none; }
  .row.expanded {
    flex-wrap: wrap;
    overflow-x: visible;
  }
  .card {
    flex: 0 0 108px;
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #fafafa;
    border: 1px solid #f0f0f0;
    border-radius: 4px;
    display: block;
    margin-bottom: 10px;
  }
  .card .title {
    font-size: 12px;
    line-height: 1.45;
    color: #333;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .empty {
    text-align: center;
    color: #bbb;
    padding: 48px 0;
    font-size: 13px;
  }
  .result-title {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 14px;
    color: #8a8a8a;
  }
</style>
</head>
<body>

<div class="disclaimer" id="disclaimer"></div>

<main>
  <div class="profile">
    <img id="avatarImg" src="" alt="">
    <div class="username" id="usernameEl"></div>
    <div class="bio" id="bioEl"></div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="상품을 검색해 보세요">
    <span class="icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
  </div>

  <div id="categoryContainer"></div>
  <div id="searchResult" style="display:none;"></div>
</main>

<script src="data.js"></script>
<script>
  const DEFAULT_DISCLAIMER = "쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다. 상품 목록 및 상품에 대한 설명은 운영자가 직접 구성하고 작성한 것으로, 이에 대한 모든 책임은 운영자에게 있습니다.";
  const FALLBACK_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><rect width='140' height='140' fill='%23fafafa'/></svg>";
  const FALLBACK_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='84' height='84'><rect width='84' height='84' fill='%23f3f3f3'/></svg>";

  document.getElementById('disclaimer').textContent = (typeof disclaimer === 'string' && disclaimer) ? disclaimer : DEFAULT_DISCLAIMER;
  const avatarEl = document.getElementById('avatarImg');
  avatarEl.src = profile.avatar;
  avatarEl.onerror = function () { avatarEl.onerror = null; avatarEl.src = FALLBACK_AVATAR; };
  document.getElementById('usernameEl').textContent = profile.username;
  document.getElementById('bioEl').textContent = profile.bio;

  function handleImgError(el) {
    el.onerror = null;
    el.src = FALLBACK_IMG;
  }

  function cardHtml(item) {
    return `
      <a class="card" href="${item.link}" target="_blank" rel="noopener noreferrer">
        <img src="${item.image}" alt="" onerror="handleImgError(this)">
        <div class="title">${item.title}</div>
      </a>`;
  }

  const categoryContainer = document.getElementById('categoryContainer');

  categories.forEach((cat, idx) => {
    const section = document.createElement('div');
    section.className = 'category';
    section.innerHTML = `
      <div class="category-header">
        <div class="title">${cat.title}</div>
        <button class="toggle" data-idx="${idx}">펼쳐보기</button>
      </div>
      <div class="row" id="row-${idx}">
        ${cat.items.map(cardHtml).join('')}
      </div>`;
    categoryContainer.appendChild(section);
  });

  categoryContainer.addEventListener('click', (e) => {
    if (!e.target.classList.contains('toggle')) return;
    const idx = e.target.dataset.idx;
    const row = document.getElementById('row-' + idx);
    const expanded = row.classList.toggle('expanded');
    e.target.textContent = expanded ? '접기' : '펼쳐보기';
  });

  const searchInput = document.getElementById('searchInput');
  const searchResult = document.getElementById('searchResult');

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      categoryContainer.style.display = '';
      searchResult.style.display = 'none';
      return;
    }
    const matches = categories.flatMap(c => c.items).filter(item => item.title.toLowerCase().includes(q));
    categoryContainer.style.display = 'none';
    searchResult.style.display = '';
    if (matches.length === 0) {
      searchResult.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`;
    } else {
      searchResult.innerHTML = `
        <div class="result-title">검색 결과 (${matches.length})</div>
        <div class="row expanded">${matches.map(cardHtml).join('')}</div>`;
    }
  });
</script>

</body>
</html>
