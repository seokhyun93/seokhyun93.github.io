<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script>
  function handleImgError(el) {
    el.onerror = null;
    el.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><rect width='140' height='140' fill='%23fafafa'/></svg>";
  }
</script>
<style>
  :root {
    --accent: #c9705a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #ffffff;
    color: #141414;
  }
  .disclaimer {
    padding: 14px 24px;
    font-size: 11px;
    line-height: 1.6;
    color: #a3a3a3;
    letter-spacing: 0.01em;
    text-align: center;
    border-bottom: 1px solid #f2f2f2;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 0 60px;
  }
  .profile {
    text-align: center;
    padding: 40px 24px 28px;
  }
  .profile img {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    background: #f3f3f3;
    border: 1px solid #eaeaea;
  }
  .profile .username {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .profile .bio {
    margin-top: 5px;
    font-size: 12.5px;
    color: #8a8a8a;
  }
  .search-box {
    position: relative;
    margin: 0 24px 40px;
  }
  .search-box input {
    width: 100%;
    padding: 9px 26px 9px 2px;
    font-size: 13.5px;
    border: none;
    border-bottom: 1.5px solid var(--accent);
    outline: none;
    background: transparent;
    font-family: inherit;
    color: #141414;
  }
  .search-box input::placeholder {
    color: #bbb;
  }
  .search-box .icon {
    position: absolute;
    right: 2px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    pointer-events: none;
  }
  .category {
    padding: 0 24px 36px;
  }
  .category-header {
    margin-bottom: 16px;
  }
  .category-header .title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .row {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .row::-webkit-scrollbar { display: none; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 24px 12px;
  }
  .product-card, .row .product-card {
    display: block;
  }
  .row .product-card {
    flex: 0 0 108px;
  }
  .product-image {
    display: block;
    text-decoration: none;
  }
  .product-image img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #fafafa;
    border: 1px solid #f0f0f0;
    border-radius: 4px;
    display: block;
    margin-bottom: 10px;
  }
  .product-title {
    font-size: 12px;
    line-height: 1.45;
    color: #333;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .link-chip {
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid #eee;
    border-radius: 999px;
    color: #555;
    text-decoration: none;
    white-space: nowrap;
  }
  .link-chip:hover {
    border-color: var(--accent);
    color: #141414;
  }
  .pager {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-top: 28px;
    font-size: 12.5px;
    color: #666;
  }
  .pager button {
    font-family: inherit;
    font-size: 12px;
    padding: 6px 14px;
    border: 1px solid #eee;
    background: #fff;
    border-radius: 999px;
    cursor: pointer;
    color: #141414;
  }
  .pager button:disabled {
    color: #ccc;
    border-color: #f5f5f5;
    cursor: default;
  }
  .empty {
    text-align: center;
    color: #bbb;
    padding: 48px 0;
    font-size: 13px;
  }
  .result-title {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 14px;
    color: #8a8a8a;
  }
</style>
</head>
<body>

<div class="disclaimer">쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다. 상품 목록 및 상품에 대한 설명은 운영자가 직접 구성하고 작성한 것으로, 이에 대한 모든 책임은 운영자에게 있습니다.</div>

<main>
  <div class="profile">
    <img id="avatarImg" src="images/avatar.jpg" alt="" onerror="handleImgError(this)">
    <div class="username">select_home</div>
    <div class="bio">이쁘고 유용한 꿀템만 소개해요❤️</div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="상품을 검색해 보세요">
    <span class="icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
  </div>

  <div id="normalSections">
    <div class="category">
      <div class="category-header"><div class="title">💗인기 제품💗</div></div>
      <div class="row" id="popularRow"></div>
    </div>

    <div class="category">
      <div class="category-header"><div class="title">전체 상품</div></div>
      <div class="grid" id="productGrid"></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>

  <div id="searchResult" style="display:none;"></div>
</main>

<script src="public.js"></script>

</body>
</html>
